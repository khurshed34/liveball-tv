
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081009">
<title>LIVEBALL TV</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#081009;--panel:#111c14;--green:#16d66a;--muted:#9aab9e;--red:#ff4141}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:white;font-family:Arial,sans-serif}
header{padding:18px 15px;background:#101b13;border-bottom:1px solid #26372a}
.logo{font-size:23px;font-weight:900;color:#fff}
.logo span{color:var(--green)}
.live-label{color:var(--red);font-weight:bold;font-size:12px;margin-top:7px}
.tabs{display:flex;gap:8px;padding:13px;overflow-x:auto}
.tab{border:1px solid #2b3b2e;background:#142017;color:white;border-radius:20px;padding:10px 15px;white-space:nowrap}
.tab.active{background:#146b38;border-color:#16d66a}
.section{padding:0 13px 15px}
.heading{font-size:17px;font-weight:800;margin:12px 0}
.player{background:linear-gradient(145deg,#14271a,#0b120d);border:1px solid #31543a;border-radius:15px;padding:15px;margin-bottom:18px}
.player-title{font-weight:900;color:var(--green);font-size:16px;margin-bottom:12px}
.player-status{font-size:12px;color:#ff5555;font-weight:bold;margin-bottom:12px}
.teams{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center}
.team{width:38%;font-size:13px;font-weight:bold;overflow-wrap:anywhere}
.score{font-size:25px;font-weight:900;white-space:nowrap}
.match-time{text-align:center;color:#c4d4c7;font-size:12px;margin-top:12px}
.video{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;margin-top:13px;display:none}
.player-note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5}
.match{background:var(--panel);border:1px solid #26372a;border-radius:12px;padding:13px;margin-bottom:10px;cursor:pointer}
.match:active{border-color:var(--green)}
.league{font-size:12px;color:#a9b9ad;margin-bottom:10px}
.match-status{font-size:11px;color:var(--red);font-weight:bold;margin-bottom:9px}
.match-teams{display:flex;align-items:center;justify-content:space-between;gap:8px}
.match-team{font-size:13px;font-weight:bold;flex:1;overflow-wrap:anywhere}
.match-team:last-child{text-align:right}
.match-score{font-size:18px;font-weight:900;white-space:nowrap}
.match-time-small{font-size:11px;color:var(--muted);margin-top:9px}
.logo-img{width:25px;height:25px;object-fit:contain;vertical-align:middle;margin-right:5px}
.empty{text-align:center;padding:25px 10px;color:var(--muted)}
.refresh{width:100%;border:0;border-radius:10px;background:#176b39;color:white;padding:13px;font-weight:bold;margin:12px 0}
.footer{text-align:center;color:#849488;font-size:11px;padding:18px}
</style>
</head>
<body>

<header>
  <div class="logo">⚽ LIVEBALL <span>TV</span></div>
  <div class="live-label">● LIVE FOOTBALL</div>
</header>

<nav class="tabs">
  <button class="tab active" data-filter="all">Ҳама</button>
  <button class="tab" data-filter="live">🔴 Зинда</button>
  <button class="tab" data-filter="upcoming">📅 Оянда</button>
  <button class="tab" data-filter="finished">🏁 Натиҷаҳо</button>
</nav>

<main class="section">
  <div class="heading">📺 ПАХШИ МУСТАҚИМ</div>

  <section class="player" id="player">
    <div class="player-title">🔴 БОЗИИ ЗИНДА</div>
    <div class="empty">Маълумоти бозӣ бор шуда истодааст...</div>
  </section>

  <div class="heading" id="listTitle">🔴 БОЗИҲОИ ЗИНДА</div>
  <div id="matches">
    <div class="empty">Бозиҳо бор шуда истодаанд...</div>
  </div>

  <button class="refresh" onclick="loadMatches()">↻ НАВСОЗӢ</button>
</main>

<div class="footer">
  LIVEBALL TV • Натиҷаҳо аз API-Football гирифта мешаванд.<br>
  Видео танҳо аз манбаъҳои расмӣ ва иҷозатдодашуда.
</div>

<script>
const DATA_URL="https://khurshed34.github.io/liveball-tv/matches.json";
let allMatches=[];
let currentFilter="live";
let selectedId=null;

const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

function safeText(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function safeImage(url){
  if(!url)return "";
  try{
    const u=new URL(url);
    return u.protocol==="https:"?u.href:"";
  }catch(e){return "";}
}

function isLive(m){
  return m.category==="live";
}

function formatTime(date){
  if(!date)return "";
  const d=new Date(date);
  if(isNaN(d))return "";
  return d.toLocaleString("tg-TJ",{
    timeZone:"Asia/Dushanbe",
    day:"2-digit",month:"2-digit",
    hour:"2-digit",minute:"2-digit"
  });
}

function teamHTML(name,logo){
  const image=safeImage(logo);
  return `${image?`<img class="logo-img" src="${image}" alt="" onerror="this.style.display='none'">`:""}${safeText(name)}`;
}

function renderPlayer(m){
  const box=document.getElementById("player");
  if(!m){
    box.innerHTML=`
      <div class="player-title">📺 ПАХШИ МУСТАҚИМ</div>
      <div class="empty">Ҳоло бозии зинда нест.</div>
      <div class="player-note">Ҳангоми сар шудани бозӣ, он дар ин ҷо худкор пайдо мешавад.</div>`;
    return;
  }

  const stream=safeImage(m.stream_url);
  box.innerHTML=`
    <div class="player-title">🔴 БОЗИИ ЗИНДА</div>
    <div class="player-status">● ${safeText(m.status_text||"LIVE")}</div>
    <div class="teams">
      <div class="team">${teamHTML(m.home,m.home_logo)}</div>
      <div class="score">${m.home_goals??0} : ${m.away_goals??0}</div>
      <div class="team">${teamHTML(m.away,m.away_logo)}</div>
    </div>
    <div class="match-time">${safeText(m.league||"Футбол")} • ${safeText(m.country||"")}</div>
    <div class="match-time">${safeText(m.status_text||"Бозӣ идома дорад")}</div>
    ${stream?`<video class="video" controls autoplay playsinline src="${stream}" style="display:block"></video>`:
    `<div class="player-note">📺 Барои ин бозӣ ҳоло манбаи расмии видео дастрас нест.<br>Ҳисоб ва ҳолати бозӣ дар ин ҷо нишон дода мешаванд.</div>`}
  `;
}

function renderList(){
  const container=document.getElementById("matches");
  const title=document.getElementById("listTitle");

  const titles={
    all:"⚽ ҲАМАИ БОЗИҲО",
    live:"🔴 БОЗИҲОИ ЗИНДА",
    upcoming:"📅 БОЗИҲОИ ОЯНДА",
    finished:"🏁 НАТИҶАҲО"
  };
  title.textContent=titles[currentFilter];

  const list=allMatches.filter(m=>
    currentFilter==="all"||
    m.category===currentFilter
  );

  if(!list.length){
    container.innerHTML='<div class="empty">Дар ин бахш ҳоло бозӣ нест.</div>';
    return;
  }

  container.innerHTML=list.map(m=>`
    <article class="match" onclick="selectMatch(${Number(m.id)})">
      <div class="league">${safeText(m.country||"")} • ${safeText(m.league||"")}</div>
      <div class="match-status">${m.category==="live"?"● LIVE":safeText(m.status_text||"")}</div>
      <div class="match-teams">
        <div class="match-team">${teamHTML(m.home,m.home_logo)}</div>
        <div class="match-score">${m.home_goals??"-"} : ${m.away_goals??"-"}</div>
        <div class="match-team">${teamHTML(m.away,m.away_logo)}</div>
      </div>
      <div class="match-time-small">${safeText(formatTime(m.date))} • Барои интихоб пахш кунед</div>
    </article>
  `).join("");
}

function selectMatch(id){
  const m=allMatches.find(x=>Number(x.id)===Number(id));
  if(!m)return;
  selectedId=m.id;
  renderPlayer(m);
  window.scrollTo({top:0,behavior:"smooth"});
}

function setFilter(filter){
  currentFilter=filter;
  document.querySelectorAll(".tab").forEach(b=>{
    b.classList.toggle("active",b.dataset.filter===filter);
  });
  renderList();

  if(filter==="live"){
    const live=allMatches.filter(isLive);
    const selected=live.find(m=>Number(m.id)===Number(selectedId))||live[0];
    if(selected){
      selectedId=selected.id;
      renderPlayer(selected);
    }else{
      renderPlayer(null);
    }
  }
}

document.querySelectorAll(".tab").forEach(button=>{
  button.addEventListener("click",()=>setFilter(button.dataset.filter));
});

async function loadMatches(){
  const container=document.getElementById("matches");
  try{
    const response=await fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"});
    if(!response.ok)throw new Error("HTTP "+response.status);

    const data=await response.json();
    allMatches=Array.isArray(data.fixtures)?data.fixtures:[];

    const live=allMatches.filter(isLive);
    let selected=live.find(m=>Number(m.id)===Number(selectedId));

    if(!selected)selected=live[0]||null;

    if(selected){
      selectedId=selected.id;
      renderPlayer(selected);
    }else if(currentFilter==="live"){
      renderPlayer(null);
    }else{
      const chosen=allMatches.find(m=>Number(m.id)===Number(selectedId));
      renderPlayer(chosen||null);
    }

    renderList();
  }catch(error){
    container.innerHTML='<div class="empty">Маълумот бор нашуд. Пайвасти интернетро санҷед.</div>';
    console.error(error);
  }
}

loadMatches();
setInterval(loadMatches,30000);
</script>
</body>
</html>
